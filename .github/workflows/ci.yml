name: CI

on:
  push:
    branches:
      - main
      - feat/mcp-registry
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after cloud configuration is ready"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  PROJECT_ID: capstone-mcpregistry
  REGION: us-central1
  SERVICE: agent-platform
  IMAGE: us-central1-docker.pkg.dev/capstone-mcpregistry/capstone-mcpregistry/agent-platform

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      UV_PYTHON: "3.12"
      # Temporary CI database password, not your local password.
      POSTGRES_PASSWORD: registry_ci_only

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mcp_registry
          POSTGRES_USER: registry_admin
          POSTGRES_PASSWORD: registry_ci_only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U registry_admin -d mcp_registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint application
        run: uv run --with ruff ruff check app --select E9,F

      - name: Import application
        run: uv run python -c "from app.main import app"

      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Check database connection
        run: uv run python -m scripts.check_database

      - name: Check transaction rollback
        run: uv run python -m scripts.check_registry_rollback

      - name: Check concurrent duplicate protection
        run: uv run python -m scripts.check_registry_concurrency

      - name: Check application startup and HTTP endpoints
        run: |
          uv run --with httpx python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          with TestClient(app) as client:
              response = client.get("/health")
              assert response.status_code == 200, response.text
              assert response.json() == {"status": "ok"}

              response = client.get("/registry/servers")
              assert response.status_code == 200, response.text
              assert response.json()["items"] == []

              response = client.get("/registry/servers?limit=0")
              assert response.status_code == 422, response.text

          print("Application startup and HTTP checks passed.")
          PY

      - name: Build Docker image
        run: docker build -t agent-platform:ci .

  deploy:
    needs: checks
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy == true &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker \
            "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build deployment image
        run: docker build -t "${{ env.IMAGE }}:${{ github.sha }}" .

      - name: Push deployment image
        run: docker push "${{ env.IMAGE }}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          flags: --allow-unauthenticated --port=8000

      - name: Show application URL
        run: |
          echo "Application URL: ${{ steps.deploy.outputs.url }}" \
            >> "$GITHUB_STEP_SUMMARY"