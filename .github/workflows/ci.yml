name: CI

on:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (syntax/undefined-name check)
        run: uv run --with ruff ruff check app --select E9,F

      - name: Import check (app builds without error)
        run: uv run python -c "from app.main import app"

      - name: Build Docker image
        run: docker build -t agent-platform:ci .
