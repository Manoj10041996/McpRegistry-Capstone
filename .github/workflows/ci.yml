name: CI

# Runs whenever code is pushed to main.
# First it checks the code, tests it, and builds a Docker image.
# Deployment happens only when all checks pass.

on:
  push:
    branches: [main]

env:
  PROJECT_ID: capstone-mcpregistry
  REGION: us-central1
  REPOSITORY: capstone-mcpregistry
  SERVICE: agent-platform
  IMAGE: us-central1-docker.pkg.dev/capstone-mcpregistry/capstone-mcpregistry/agent-platform

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint Python code
        run: uv run --with ruff ruff check app tests --select E9,F

      - name: Import FastAPI application
        run: uv run python -c "from app.main import app"

      - name: Run automated API tests
        run: uv run python -m pytest -q

      - name: Build Docker image for verification
        run: docker build -t agent-platform:ci .

  deploy:
    needs: checks
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            ${{ env.REGION }}-docker.pkg.dev \
            --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          flags: --allow-unauthenticated --port=8000

      - name: Show application URL
        run: |
          echo "Deployed URL: ${{ steps.deploy.outputs.url }}"
          {
            echo "### Deployed to Cloud Run"
            echo "${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"