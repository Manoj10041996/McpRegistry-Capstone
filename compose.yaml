services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcp_registry
      POSTGRES_USER: registry_admin
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - registry_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry_admin -d mcp_registry"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  registry_pg_data: